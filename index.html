<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sick Day — surf rankings</title>
<meta name="description" content="Ranked surf spots for NorCal and Oahu, updated through the day. Pick a region, pick a time window, see where it's best.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --paper: #f1f0ea;
    --ink: #121210;
    --muted: #6d6b62;
    --line: #d8d6cb;
    --hairline: #c9c7bb;
    --fire: #d43d17;
    --blue: #1d5bbf;
    --green: #17803d;
    --amber: #8f6400;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 1.4rem 1.2rem 4rem; }
  .eyebrow {
    font-size: 0.72rem; letter-spacing: 0.28em; text-transform: uppercase;
    margin-bottom: 0.9rem;
  }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
  h1 {
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-size: clamp(3.2rem, 13vw, 8rem); line-height: 0.88;
    margin: 0; letter-spacing: -0.01em; text-transform: uppercase;
  }
  .stat { text-align: right; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); }
  .stat b { display: block; font-size: 1.5rem; letter-spacing: 0.05em; font-weight: 700; }
  .stat span { color: var(--muted); }

  .controls { margin: 1.6rem 0 0.4rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .chips { display: flex; gap: 1.1rem; flex-wrap: wrap; }
  .chip {
    background: none; border: none; padding: 0 0 3px; cursor: pointer;
    font-family: inherit; font-size: 0.76rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent;
  }
  .chip.on { color: var(--ink); border-bottom-color: var(--fire); }

  .tideline {
    margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--hairline);
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
    display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: space-between;
  }
  .tideline .t-lbl { color: var(--muted); }
  #tidechart { display: block; width: 100%; height: auto; margin-top: 0.2rem; }

  .tip { cursor: help; border-bottom: 1px dotted var(--muted); position: relative; }
  .tip:hover::after, .tip:focus::after {
    content: attr(data-tip); position: absolute; right: 0; top: 1.5rem; z-index: 10;
    background: var(--ink); color: var(--paper); padding: 0.55rem 0.75rem;
    font-size: 0.66rem; letter-spacing: 0.1em; line-height: 1.9;
    white-space: pre; text-align: left; border-radius: 4px; text-transform: none;
  }

  .cols {
    display: flex; justify-content: space-between; font-size: 0.68rem;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
    padding: 1.1rem 0 0.5rem; border-bottom: 1px solid var(--ink); margin-top: 0.4rem;
  }
  .row {
    display: flex; align-items: center; gap: 1.2rem;
    padding: 1rem 0; border-bottom: 1px solid var(--hairline);
  }
  .rank { font-size: 0.8rem; color: var(--muted); width: 1.6rem; flex-shrink: 0; }
  .who { flex: 1; min-width: 0; }
  .name {
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-size: clamp(1.5rem, 4.5vw, 2.3rem); line-height: 1; text-transform: uppercase;
    letter-spacing: 0.005em;
  }
  .sub {
    font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); margin-top: 0.35rem;
  }
  .data { display: flex; gap: 1.6rem; flex-shrink: 0; text-align: right; }
  .cell { display: flex; flex-direction: column; gap: 2px; }
  .cell .lbl { font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .cell .val { font-size: 0.95rem; white-space: nowrap; }
  .skill { width: 2.4rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 2px; }
  .q { width: 3rem; flex-shrink: 0; display: flex; justify-content: flex-end; }
  .score { font-size: 1.15rem; font-weight: 700; line-height: 1; }

  footer { margin-top: 1.6rem; font-size: 0.68rem; letter-spacing: 0.08em; color: var(--muted); line-height: 1.8; }
  footer a { color: var(--ink); }
  .empty { padding: 3rem 0; text-align: center; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; }

  @media (max-width: 700px) {
    .row { flex-wrap: wrap; gap: 0.5rem 1rem; }
    .who { flex-basis: calc(100% - 6.5rem); }
    .data { width: 100%; justify-content: flex-start; text-align: left; padding-left: 2.8rem; gap: 1.4rem; }
    .masthead { flex-direction: column; align-items: flex-start; }
    .stat { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow">LOADING…</div>
  <div class="masthead">
    <h1>Sick<br>Day</h1>
    <div class="stat" id="stat"></div>
  </div>

  <div class="controls">
    <div class="chips" id="regions"></div>
    <div class="chips" id="days"></div>
    <div class="chips" id="parts"></div>
  </div>

  <div class="tideline" id="tideline"></div>
  <svg id="tidechart" viewBox="0 0 720 62" role="img" aria-label="Tide chart for the selected day"></svg>
  <div class="cols"><span>Rank · Spot</span><span>Swell · Wind ·
    <span class="tip" id="tip-skill" tabindex="0">Skill</span> ·
    <span class="tip" id="tip-quality" tabindex="0">Quality</span></span></div>
  <div id="list"><div class="empty">Loading…</div></div>

  <footer>
    Scores 0–100. Swell &amp; wind from <a href="https://open-meteo.com">Open-Meteo</a>, tides from NOAA.
    Forecasts further out are less certain. Surf at your own risk.
  </footer>
</div>

<script>
const PART_LABELS = {
  overall: "Best of day", dawn: "Dawn 5–9", late_am: "Late AM 9–12",
  early_pm: "Early PM 12–3", late_pm: "Late PM 3–8",
};
// Quality: score color by tier (green = go, like a green light)
const TIERS = [
  { name: "Firing", color: "var(--fire)" },   // 90+
  { name: "Go", color: "var(--green)" },      // threshold+
  { name: "Fun", color: "var(--blue)" },      // 60+
  { name: "Marginal", color: "var(--amber)" },// 40+
  { name: "Skip", color: "var(--muted)" },
];
// Skill: ski-style rating of the BREAK itself
const SKILL = {
  green: { glyph: "circle", color: "var(--green)", label: "All levels" },
  blue: { glyph: "square", color: "var(--blue)", label: "Intermediate" },
  black: { glyph: "diamond", color: "var(--ink)", label: "Advanced" },
  double_black: { glyph: "ddiamond", color: "var(--ink)", label: "Experts" },
};
let DATA = null;
let state = { region: null, day: 0, part: "overall" };

function svgGlyph(kind, color) {
  const s = (inner) =>
    `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${inner}</svg>`;
  if (kind === "circle") return s(`<circle cx="7" cy="7" r="5.5" fill="${color}"></circle>`);
  if (kind === "hollow") return s(`<circle cx="7" cy="7" r="5" fill="none" stroke="${color}" stroke-width="1.5"></circle>`);
  if (kind === "square") return s(`<rect x="2" y="2" width="10" height="10" fill="${color}"></rect>`);
  return s(`<path d="M7 0.5 L13.5 7 L7 13.5 L0.5 7 Z" fill="${color}"></path>`);
}

function tierFor(score) {
  if (score >= 90) return TIERS[0];
  if (score >= DATA.threshold) return TIERS[1];
  if (score >= 60) return TIERS[2];
  if (score >= 40) return TIERS[3];
  return TIERS[4];
}

function qualityHTML(score) {
  const tier = tierFor(score);
  return `<span class="score" style="color:${tier.color}" title="${tier.name}">${score}</span>`;
}

function skillHTML(difficulty) {
  const s = SKILL[difficulty] || SKILL.blue;
  const g = svgGlyph(s.glyph, s.color);
  return s.glyph === "ddiamond" ? g + g : g;
}

function chip(label, on, cb) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.textContent = label;
  b.onclick = cb;
  return b;
}

function dayLabel(iso, i) {
  if (i === 0) return "Today";
  if (i === 1) return "Tmrw";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });
}

function fmtHour(t) {
  const h = parseInt(t, 10);
  return (h % 12 || 12) + (h < 12 ? "am" : "pm");
}

// Fractional hour-of-day right now in a region's timezone
function nowHourIn(tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hour12: false, hour: "numeric", minute: "numeric",
  }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  return (parseInt(p.hour, 10) % 24) + parseInt(p.minute, 10) / 60;
}
function todayIn(tz) {
  return new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(new Date());
}

// Catmull-Rom through points -> smooth cubic bezier path
function smoothPath(pts) {
  if (pts.length < 2) return "";
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i],
          p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function renderTide(day, region) {
  const svg = document.getElementById("tidechart");
  const strip = document.getElementById("tideline");
  const curve = day.tide_curve || [];
  if (curve.length < 2) {
    svg.style.display = "none";
    if (day.tides && day.tides.length) {
      strip.style.display = "flex";
      strip.innerHTML = '<span class="t-lbl">Tide</span>' + day.tides.map((t) =>
        `<span>${t.type} ${fmtHour(t.time)} · ${t.height_ft}ft</span>`).join("");
    } else strip.style.display = "none";
    return;
  }
  strip.style.display = "flex";
  strip.innerHTML = '<span class="t-lbl">Tide</span>';
  svg.style.display = "block";

  const W = 720, H = 62, padX = 10, padTop = 15, padBot = 13;
  const hs = curve.map((p) => p.h);
  const lo = Math.min(...hs), hi = Math.max(...hs), span = (hi - lo) || 1;
  const X = (hour) => padX + (hour / 23) * (W - 2 * padX);
  const Y = (h) => padTop + (1 - (h - lo) / span) * (H - padTop - padBot);
  const pts = curve.map((p, i) => ({ x: X(i), y: Y(p.h) }));

  // Split solid (elapsed) vs dashed (projection): today splits at now,
  // future days are entirely projection.
  const isToday = day.date === todayIn(region.timezone);
  let split = isToday ? Math.min(23, Math.max(0, nowHourIn(region.timezone))) : 0;
  const si = Math.floor(split);
  const frac = split - si;
  const nowPt = isToday && si < 23
    ? { x: X(split), y: Y(curve[si].h + (curve[si + 1].h - curve[si].h) * frac) }
    : null;

  const ink = "#121210", muted = "#6d6b62", fire = "#d43d17", hair = "#c9c7bb";
  let parts = [];
  parts.push(`<line x1="${padX}" y1="${H - padBot}" x2="${W - padX}" y2="${H - padBot}" stroke="${hair}" stroke-width="1"></line>`);
  if (nowPt) {
    const solid = pts.slice(0, si + 1).concat([nowPt]);
    const dashed = [nowPt].concat(pts.slice(si + 1));
    parts.push(`<path d="${smoothPath(solid)}" fill="none" stroke="${ink}" stroke-width="2"></path>`);
    parts.push(`<path d="${smoothPath(dashed)}" fill="none" stroke="${ink}" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"></path>`);
    parts.push(`<line x1="${nowPt.x.toFixed(1)}" y1="${padTop - 4}" x2="${nowPt.x.toFixed(1)}" y2="${H - padBot}" stroke="${hair}" stroke-width="1"></line>`);
    parts.push(`<circle cx="${nowPt.x.toFixed(1)}" cy="${nowPt.y.toFixed(1)}" r="3" fill="${fire}"></circle>`);
  } else {
    parts.push(`<path d="${smoothPath(pts)}" fill="none" stroke="${ink}" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"></path>`);
  }
  // Direct labels on the extremes
  for (const t of day.tides || []) {
    const h24 = parseInt(t.time, 10);
    const x = X(h24), y = Y(t.height_ft);
    const up = t.type === "high";
    let lx = Math.min(W - padX - 4, Math.max(padX + 4, x));
    let anchor = "middle";
    if (lx < 60) anchor = "start";
    if (lx > W - 60) anchor = "end";
    parts.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${ink}"></circle>`);
    parts.push(`<text x="${lx.toFixed(1)}" y="${(up ? y - 7 : y + 13).toFixed(1)}" text-anchor="${anchor}" ` +
      `font-family="Space Mono, monospace" font-size="9" letter-spacing="0.8" fill="${muted}">` +
      `${up ? "H" : "L"} ${fmtHour(t.time).toUpperCase()} · ${t.height_ft}FT</text>`);
  }
  svg.innerHTML = parts.join("");
}

function render() {
  const regions = DATA.regions;
  if (!state.region) state.region = Object.keys(regions)[0];
  const region = regions[state.region];
  const days = region.days;
  if (state.day >= days.length) state.day = 0;
  const day = days[state.day];

  const dateStr = new Date(day.date + "T12:00:00")
    .toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  document.getElementById("eyebrow").textContent =
    `${dateStr} · ${region.name}`.toUpperCase().split("").join(" ");

  const age = Math.round((Date.now() - new Date(DATA.generated_at)) / 60000);
  const ageStr = age < 60 ? age + "m" : Math.round(age / 60) + "h";
  const entries = state.part === "overall" ? day.overall : day.by_daypart[state.part];
  document.getElementById("stat").innerHTML =
    `<span>Spots / Updated</span><b>${(entries || []).length} / ${ageStr}</b>`;

  document.getElementById("regions").replaceChildren(
    ...Object.entries(regions).map(([k, v]) =>
      chip(v.name, k === state.region, () => { state.region = k; state.day = 0; render(); })));
  document.getElementById("days").replaceChildren(
    ...days.map((d, i) => chip(dayLabel(d.date, i), i === state.day, () => { state.day = i; render(); })));
  const parts = ["overall", ...Object.keys(DATA.dayparts)];
  document.getElementById("parts").replaceChildren(
    ...parts.map((p) => chip(PART_LABELS[p] || p, p === state.part, () => { state.part = p; render(); })));

  renderTide(day, region);

  document.getElementById("tip-skill").setAttribute("data-tip",
    "Skill rating of the break\n● All levels\n■ Intermediate\n◆ Advanced\n◆◆ Experts only");
  document.getElementById("tip-quality").setAttribute("data-tip",
    `Conditions score, 0–100\n90+  Firing\n${DATA.threshold}+  Go — drop your plans\n60+  Fun\n40+  Marginal\n<40  Skip`);

  const list = document.getElementById("list");
  if (!entries || !entries.length) {
    list.innerHTML = '<div class="empty">No scoreable surf in this window</div>';
    return;
  }
  list.replaceChildren(...entries.map((e, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <span class="rank">${String(i + 1).padStart(2, "0")}</span>
      <span class="who">
        <div class="name"></div>
        <div class="sub"></div>
      </span>
      <span class="data">
        <span class="cell"><span class="lbl">Swell</span><span class="val">${e.height_ft}ft @ ${e.period_s}s ${e.direction}</span></span>
        <span class="cell"><span class="lbl">Wind</span><span class="val">${e.wind}</span></span>
      </span>
      <span class="skill" title="${(SKILL[e.difficulty] || SKILL.blue).label}">${skillHTML(e.difficulty)}</span>
      <span class="q">${qualityHTML(e.score)}</span>`;
    row.querySelector(".name").textContent = e.name;
    row.querySelector(".sub").textContent =
      `${e.break_type}${e.swell_window ? " · takes " + e.swell_window : ""} · best ${fmtHour(e.best_time)}`;
    return row;
  }));
}

fetch("rankings.json?t=" + Math.floor(Date.now() / 300000))
  .then((r) => r.json())
  .then((d) => { DATA = d; render(); })
  .catch(() => {
    document.getElementById("list").innerHTML =
      '<div class="empty">Couldn\'t load rankings — try again shortly</div>';
  });
</script>
</body>
</html>
